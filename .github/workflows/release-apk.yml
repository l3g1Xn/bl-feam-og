name: Build and publish BattleLegions.apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/music/**"
      - "public/cards/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.mobile.config.ts"
      - ".github/workflows/release-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-fund --no-audit || npm install --no-fund --no-audit
          else
            npm install --no-fund --no-audit
          fi

      - name: Commit regenerated package-lock.json
        run: |
          if [ -f package-lock.json ] && ! git diff --quiet package-lock.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(ci): regenerate package-lock for uuid/nanoid security overrides" || true
            git push || true
          elif [ -f package-lock.json ] && [ -z "$(git ls-files package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(ci): add package-lock for uuid/nanoid security overrides" || true
            git push || true
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Ensure targetSdk 34
        run: |
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/' android/variables.gradle || true
          grep targetSdkVersion android/variables.gradle

      - name: Materialize release keystore from secrets (or generate temporary)
        env:
          BL_KEYSTORE_BASE64: ${{ secrets.BL_KEYSTORE_BASE64 }}
          BL_STORE_PASS: ${{ secrets.BL_STORE_PASS }}
          BL_KEY_PASS: ${{ secrets.BL_KEY_PASS }}
        run: |
          set -euo pipefail
          mkdir -p mobile/signing
          KS=mobile/signing/battlelegions-release.jks
          USED_SECRETS=0
          if [ -n "${BL_KEYSTORE_BASE64:-}" ] && [ -n "${BL_STORE_PASS:-}" ] && [ -n "${BL_KEY_PASS:-}" ]; then
            echo "Attempting to materialize keystore from Actions secrets..."
            if echo "$BL_KEYSTORE_BASE64" | base64 -d > "$KS" 2>/dev/null; then
              chmod 600 "$KS"
              if keytool -list -keystore "$KS" -storepass "$BL_STORE_PASS" >/dev/null 2>&1; then
                echo "Keystore materialized and validated from secrets."
                echo "BL_STORE_PASS=$BL_STORE_PASS" >> "$GITHUB_ENV"
                echo "BL_KEY_PASS=$BL_KEY_PASS" >> "$GITHUB_ENV"
                echo "BL_KEYSTORE_PATH=${{ github.workspace }}/$KS" >> "$GITHUB_ENV"
                USED_SECRETS=1
              else
                echo "::warning::Secrets provided but keystore validation failed. Falling back to temporary keystore."
                rm -f "$KS"
              fi
            else
              echo "::warning::BL_KEYSTORE_BASE64 is not valid base64. Falling back to temporary keystore."
              rm -f "$KS"
            fi
          else
            echo "::warning::Required secrets missing or empty. Generating temporary release keystore."
          fi
          if [ "$USED_SECRETS" -eq 0 ]; then
            PASS=battlelegions
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias battlelegions \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Battle Legions, OU=Dev, O=BattleLegions, L=Unknown, ST=Unknown, C=US" \
              >/dev/null
            chmod 600 "$KS"
            echo "Temporary keystore generated at $KS (alias=battlelegions)"
            echo "BL_STORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "BL_KEY_PASS=$PASS" >> "$GITHUB_ENV"
            echo "BL_KEYSTORE_PATH=${{ github.workspace }}/$KS" >> "$GITHUB_ENV"
            keytool -list -keystore "$KS" -storepass "$PASS" | head -5
          fi
          echo "Keystore ready for release signing."

      - name: Build release APK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "Using keystore: ${BL_KEYSTORE_PATH:-none}"
          echo "Store pass set: $([ -n \"${BL_STORE_PASS:-}\" ] && echo yes || echo no)"
          npm run build:mobile
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK alignment and signing
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" || true
          unzip -lv "$APK" | awk '/resources\.arsc/ {print; if ($3 != "Stored") exit 2}' || {
            echo "::warning::resources.arsc may not be Stored; check alignment carefully"
          }

      - name: Publish to release apk-release-1.0.7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/BattleLegions.apk
          NOTES=$(cat <<'MD'
          **Battle Legions v1.0.7 — Cooked By Many**

          ### 2026.08.15
          - **9 individual TraX tracks** carefully split at natural silence points
          - Wave J production card arts complete (20 new)
          - denser combat SFX/VFX · targetSdk 34 · aligned resources.arsc
          - Signing: keystore from Actions secrets (or temporary CI keystore if secrets unset)
          - **Reward-lock:** matchId + rewardedMatchIds (cap 64) — tickets/XP paid once per match

          ### 2026.08.21
          - Site Download skips stale /pkg 1.06.666 and fetches GitHub 1.0.7
          - Launcher TraX / Wave badges match 9-track soundtrack + Waves A–J
          - EndScreen rematch keeps Hard · hardware Back on EndScreen returns to launcher

          **Download:** [BattleLegions.apk](https://github.com/l3g1Xn/bl-feam-og/releases/download/apk-release-1.0.7/BattleLegions.apk)

          Hard cap: 750 MB packed · TraX 9-track · BUILD_ID 2026.08.15-v1.0.7-reward-lock
          MD
          )
          gh release view apk-release-1.0.7 >/dev/null 2>&1 || \
            gh release create apk-release-1.0.7 \
              --title "Battle Legions v1.0.7 — Cooked By Many" \
              --notes "$NOTES"
          gh release edit apk-release-1.0.7 \
            --title "Battle Legions v1.0.7 — Cooked By Many" \
            --notes "$NOTES" || true
          gh release upload apk-release-1.0.7 /tmp/BattleLegions.apk --clobber
          gh release upload v1.0.7 /tmp/BattleLegions.apk --clobber || true
          echo "Uploaded BattleLegions.apk v1.0.7 Cooked By Many"
